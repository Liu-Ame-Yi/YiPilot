name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked development dependencies
        run: uv sync --group dev --frozen
      - name: Lint
        run: uv run ruff check src tests deploy --no-cache
      - name: Type check
        run: uv run mypy src --cache-dir "$env:TEMP\\yipilot-m3-m4-mypy"
      - name: Test
        # Keep Git's generated pack filenames below Windows' path limit.
        run: uv run pytest -o addopts='' -q -p no:cacheprovider --basetemp "$env:RUNNER_TEMP/yipilot-tests"
      - name: Check diff format
        run: git diff --check
  runner-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked Runner and test dependencies
        run: uv sync --extra runner --group dev --frozen
      - name: Test durable Jobs and real HTTP transport
        run: uv run --extra runner pytest tests/integration/test_runner.py tests/unit/architecture/test_module_boundaries.py -o addopts='' -q -p no:cacheprovider
  opensandbox-profile-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned upstream wheel without runtime dependencies
        run: python -m pip install --no-deps --require-hashes -r deploy/opensandbox/requirements-build.txt
      - name: Install test runner
        run: python -m pip install pytest==8.4.2
      - name: Test guards and build real fixed patch
        run: |
          command -v patch
          python -m pytest tests/unit/workspace/test_opensandbox_profile.py tests/unit/workspace/test_opensandbox_build.py tests/unit/workspace/test_opensandbox_control.py -o addopts='' -q -p no:cacheprovider
