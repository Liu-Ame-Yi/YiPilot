name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked development dependencies
        run: uv sync --group dev --frozen
      - name: Lint
        run: uv run ruff check src tests --no-cache
      - name: Type check
        run: uv run mypy src --cache-dir "$env:TEMP\\yipilot-m3-m4-mypy"
      - name: Test
        # Keep Git's generated pack filenames below Windows' path limit.
        run: uv run pytest -o addopts='' -q -p no:cacheprovider --basetemp "$env:RUNNER_TEMP/yipilot-tests"
      - name: Check diff format
        run: git diff --check
