[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yipilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.16,<1",
    "pydantic>=2.11,<3",
    "PyYAML>=6,<7",
    "filelock>=3.18,<4",
    "platformdirs>=4.3,<5",
    "keyring>=25.6,<26",
    "httpx>=0.28,<1",
    "prompt-toolkit>=3.0,<4",
]

[project.scripts]
yipilot = "yipilot.transport.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "hypothesis>=6.120,<7",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ['live: explicit provider network validation']
